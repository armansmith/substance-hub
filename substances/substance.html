<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compoundism - Substance</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at center, #0b0c1a, #0f0f2a, #16163f);
      color: #f0e130;
    }
    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 20px;
      text-shadow: 0 0 20px #f0e130;
    }
    section {
      margin-bottom: 40px;
    }
    h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    p {
      line-height: 1.6;
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 15px;
      border-radius: 20px;
      text-decoration: none;
      color: #f0e130;
      background: rgba(255,255,255,0.05);
      transition: all 0.3s ease;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 20px #f0e130;
    }
  </style>
</head>
<body>

<div class="container">
  <a href="../index.html" class="back-btn">← Back to Home</a>
  <h1 id="substanceName">Loading...</h1>

  <section>
    <h2>Summary</h2>
    <p id="substanceSummary"></p>
  </section>

  <section>
    <h2>Description</h2>
    <p id="substanceDescription"></p>
  </section>

  <section>
    <h2>Risks / Side Effects</h2>
    <p id="substanceRisks"></p>
  </section>

  <section>
    <h2>Usage / Administration</h2>
    <p id="substanceUsage"></p>
  </section>

  <section>
    <h2>Duration</h2>
    <p id="substanceDuration"></p>
  </section>

  <section>
    <h2>Fun / Niche Fact</h2>
    <p id="substanceNiche"></p>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDB6giLOMEesZN8k3KpMUfbPBO19RUZRY0",
  authDomain: "compoundism.firebaseapp.com",
  projectId: "compoundism",
  storageBucket: "compoundism.firebasestorage.app",
  messagingSenderId: "60525355923",
  appId: "1:60525355923:web:e5d96e893bc5aa67aa7e66",
  measurementId: "G-NN9F8VKGX8"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Get substance ID from URL
const params = new URLSearchParams(window.location.search);
const substanceId = params.get('id');

async function loadSubstance() {
  if (!substanceId) {
    document.getElementById('substanceName').innerText = "No substance specified.";
    return;
  }

  const docRef = doc(db, "substances", substanceId);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {
    const data = docSnap.data();
    document.getElementById('substanceName').innerText = data.name || "N/A";
    document.getElementById('substanceSummary').innerText = data.summary || "N/A";
    document.getElementById('substanceDescription').innerText = data.description || "N/A";
    document.getElementById('substanceRisks').innerText = data.risks || "N/A";
    document.getElementById('substanceUsage').innerText = data.usage || "N/A";
    document.getElementById('substanceDuration').innerText = data.duration || "N/A";
    document.getElementById('substanceNiche').innerText = data.nicheFact || "N/A";
  } else {
    document.getElementById('substanceName').innerText = "Substance not found.";
  }
}

loadSubstance();
</script>

</body>
</html>
