const db = getFirestore(app);

const searchInput = document.getElementById('substanceSearch');
const resultsContainer = document.getElementById('searchResults');

// Load all substances from Firestore once
let substances = [];
async function loadSubstances() {
  const substancesCol = collection(db, 'substances');
  const snapshot = await getDocs(substancesCol);
  substances = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
}
await loadSubstances();
