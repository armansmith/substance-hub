<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compoundism | Login / Signup</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    /* Body & Background */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Roboto', sans-serif;
      background: radial-gradient(circle at 50% 50%, #0b0c23, #000);
      overflow: hidden;
      color: #fff;
    }

    /* Stars Animation */
    .stars {
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      position: absolute;
      animation: twinkle 2s infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; transform: translateY(0) scale(1); }
      50% { opacity: 1; transform: translateY(-2px) scale(1.2); }
      100% { opacity: 0.2; transform: translateY(0) scale(1); }
    }

    /* Auth Box */
    .auth-box {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border-radius: 1.2rem;
      padding: 2rem 2.5rem;
      width: 360px;
      box-shadow: 0 0 60px rgba(255,255,255,0.1);
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-box h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #9fa8da;
    }

    input {
      width: 100%;
      padding: 0.7rem;
      margin: 0.5rem 0;
      border: none;
      border-radius: 0.5rem;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
    }

    input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 0.5rem;
      background: linear-gradient(90deg, #7b2ff7, #f107a3);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    .toggle {
      margin-top: 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      color: #9fa8da;
    }
    .toggle:hover {
      text-decoration: underline;
    }

  </style>
</head>
<body>

  <!-- Dynamic Stars -->
  <div id="starfield"></div>

  <!-- Auth Box -->
  <div class="auth-box">
    <h2 id="formTitle">Sign Up</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="submitBtn">Sign Up</button>
    <div class="toggle" id="toggleForm">Already have an account? Log In</div>
  </div>

  <!-- Firebase + JS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDB6giLOMEesZN8k3KpMUfbPBO19RUZRY0",
      authDomain: "compoundism.firebaseapp.com",
      projectId: "compoundism",
      storageBucket: "compoundism.firebasestorage.app",
      messagingSenderId: "60525355923",
      appId: "1:60525355923:web:e5d96e893bc5aa67aa7e66",
      measurementId: "G-NN9F8VKGX8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const toggleForm = document.getElementById('toggleForm');
    const formTitle = document.getElementById('formTitle');

    let isLogin = false;

    toggleForm.addEventListener('click', () => {
      isLogin = !isLogin;
      formTitle.textContent = isLogin ? 'Log In' : 'Sign Up';
      submitBtn.textContent = isLogin ? 'Log In' : 'Sign Up';
      toggleForm.textContent = isLogin ? "Don't have an account? Sign Up" : "Already have an account? Log In";
    });

    submitBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) return alert('Enter both email and password!');

      try {
        if (isLogin) {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          alert(`Welcome back, ${userCredential.user.email}!`);
          window.location.href = 'index.html';
        } else {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          alert(`Account created for ${userCredential.user.email}`);
          window.location.href = 'index.html';
        }
      } catch (error) {
        alert(error.message);
      }
    });

    // Starfield Effect
    const starfield = document.getElementById('starfield');
    for(let i=0;i<150;i++){
      const star = document.createElement('div');
      star.className='stars';
      star.style.top = Math.random()*100+'%';
      star.style.left = Math.random()*100+'%';
      star.style.width = star.style.height = Math.random()*2+1+'px';
      starfield.appendChild(star);
    }
  </script>
</body>
</html>
